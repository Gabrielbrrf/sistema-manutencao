<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM MASTER - GABS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #2563eb; color: white; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; }
        th { background: #1e293b; color: white; }
        
        .status-pendente { color: #d97706; font-weight: bold; }
        .status-andamento { color: #2563eb; font-weight: bold; animation: pulse 2s infinite; }
        .status-concluido { color: #059669; font-weight: bold; }
        
        .badge-hospede { background: #fee2e2; color: #991b1b; padding: 2px 5px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .info-menor { font-size: 12px; color: #64748b; display: block; margin-top: 4px; }
        .btn-nf { background: #10b981; font-size: 10px; padding: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚀 Novo Chamado</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 5px;">
            <input type="text" id="c" placeholder="Local (Ex: Apto 101)">
            <input type="text" id="end" placeholder="Endereço / Edifício">
            <input type="text" id="d" placeholder="O que precisa ser feito?">
            
            <select id="h">
                <option value="NÃO">Hóspede no local? NÃO</option>
                <option value="SIM">Hóspede no local? SIM</option>
            </select>

            <select id="tipo_acesso" onchange="toggleSenha()">
                <option value="Chave">Acesso: Chave</option>
                <option value="Senha">Acesso: Senha</option>
            </select>
            <input type="text" id="senha_acesso" placeholder="Digite a Senha" style="display:none; border-color: #2563eb;">

            <select id="t">
                <option value="Israel Sillas">Israel Sillas</option>
                <option value="Wil Sampaio">Wil Sampaio</option>
            </select>
            <button onclick="salvar()">LANÇAR SERVIÇO</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Monitoramento de Obras</h2>
        <table>
            <thead>
                <tr>
                    <th>Unidade / Endereço</th>
                    <th>Serviço / Acesso</th>
                    <th>Técnico</th>
                    <th>Financeiro</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

<script>
    const sb = supabase.createClient('https://olawjagrfhcxsonmyopi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY');

    function toggleSenha() {
        const tipo = document.getElementById('tipo_acesso').value;
        document.getElementById('senha_acesso').style.display = (tipo === 'Senha') ? 'inline-block' : 'none';
    }

    async function salvar() {
        const local = document.getElementById('c').value;
        const endereco = document.getElementById('end').value;
        const desc = document.getElementById('d').value;
        const hosp = document.getElementById('h').value;
        const tipoAcesso = document.getElementById('tipo_acesso').value;
        const senhaAcesso = document.getElementById('senha_acesso').value;
        const tec = document.getElementById('t').value;

        if(!local || !desc) { alert("Preencha Local e Serviço!"); return; }

        const infoAcesso = tipoAcesso === 'Senha' ? `SENHA: ${senhaAcesso}` : 'ACESSO: CHAVE';

        await sb.from('ordens_servico').insert([{ 
            cliente: local, 
            unidade: endereco,
            descricao_servico: desc, 
            contato: infoAcesso,
            tecnico: tec, 
            status: 'Pendente',
            observacoes: hosp 
        }]);
        location.reload();
    }

    async function carregar() {
        const { data } = await sb.from('ordens_servico').select('*').order('id', {ascending: false});
        const l = document.getElementById('lista');
        l.innerHTML = '';

        data.forEach(o => {
            const fin = (o.status === 'Concluido' || o.status === 'Finalizado') 
                ? `R$ ${o.valor_mao_de_obra || 0} + R$ ${o.valor_gasto || 0}` 
                : '---';
            
            const nf = o.foto_nf ? `<button class="btn-nf" onclick="verNF('${o.foto_nf}')">VER NF</button>` : '';
            
            let classeStatus = 'status-pendente';
            if(o.status === 'Em Andamento') classeStatus = 'status-andamento';
            if(o.status === 'Concluido' || o.status === 'Finalizado') classeStatus = 'status-concluido';

            const tagHospede = o.observacoes === 'SIM' ? '<br><span class="badge-hospede">⚠️ HÓSPEDE NO LOCAL</span>' : '';

            l.innerHTML += `
                <tr>
                    <td>
                        <strong>${o.cliente}</strong>${tagHospede}
                        <span class="info-menor">📍 ${o.unidade || '---'}</span>
                    </td>
                    <td>
                        ${o.descricao_servico}
                        <span class="info-menor">🔑 ${o.contato || '---'}</span>
                    </td>
                    <td>${o.tecnico}</td>
                    <td>${fin} ${nf}</td>
                    <td><span class="${classeStatus}">${o.status.toUpperCase()}</span></td>
                    <td><button onclick="del(${o.id})">🗑️</button></td>
                </tr>`;
        });
    }

    function verNF(base64) {
        const win = window.open("");
        win.document.write(`<img src="${base64}" style="width:100%">`);
    }

    async function del(id) { if(confirm('Excluir permanentemente?')) { await sb.from('ordens_servico').delete().eq('id', id); carregar(); } }
    
    carregar();
    setInterval(carregar, 30000);
</script>
</body>
</html>
