<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM MASTER - GABS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #2563eb; color: white; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; }
        th { background: #1e293b; color: white; }
        .status-pendente { color: #d97706; font-weight: bold; }
        .status-andamento { color: #2563eb; font-weight: bold; animation: pulse 2s infinite; }
        .status-concluido { color: #059669; font-weight: bold; }
        .info-menor { font-size: 12px; color: #64748b; display: block; margin-top: 4px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚀 Novo Chamado</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 5px;">
            <input type="text" id="apto" placeholder="Apto (Ex: 101)">
            <input type="text" id="edificio" placeholder="Edifício / Condomínio">
            <input type="text" id="desc" placeholder="Descrição do Serviço">
            <select id="hosp">
                <option value="Sim">Hóspede no local? SIM</option>
                <option value="Não">Hóspede no local? NÃO</option>
            </select>
            <select id="tipo_acesso" onchange="document.getElementById('senha_input').style.display = (this.value=='Senha')?'block':'none'">
                <option value="Chave">Acesso: Chave</option>
                <option value="Senha">Acesso: Senha</option>
            </select>
            <input type="text" id="senha_input" placeholder="Digite a Senha" style="display:none;">
            <select id="tec">
                <option value="Israel Sillas">Israel Sillas</option>
                <option value="Wil Sampaio">Wil Sampaio</option>
            </select>
            <button onclick="salvar()">LANÇAR SERVIÇO</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Monitoramento</h2>
        <table>
            <thead>
                <tr>
                    <th>Local</th>
                    <th>Serviço</th>
                    <th>Técnico</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

    <script>
        const sb = supabase.createClient('https://olawjagrfhcxsonmyopi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY');

        async function salvar() {
            const apto = document.getElementById('apto').value;
            const edificio = document.getElementById('edificio').value;
            const desc = document.getElementById('desc').value;
            const hosp = document.getElementById('hosp').value;
            const acesso = document.getElementById('tipo_acesso').value;
            const senha = document.getElementById('senha_input').value;
            const tec = document.getElementById('tec').value;

            const { error } = await sb.from('ordens_servico').insert([{
                apto: apto,
                endereco_con: edificio,
                descricao_serv: desc,
                hospede_no_a: hosp,
                senha_porta: acesso === 'Senha' ? senha : 'Chave',
                tecnico: tec,
                status: 'Aberto'
            }]);

            if (error) alert("Erro ao salvar!"); else location.reload();
        }

        async function carregar() {
            const { data } = await sb.from('ordens_servico').select('*').order('id', {ascending: false});
            const l = document.getElementById('lista');
            l.innerHTML = '';
            data.forEach(o => {
                let cl = o.status === 'Aberto' ? 'status-pendente' : (o.status === 'Em Andamento' ? 'status-andamento' : 'status-concluido');
                l.innerHTML += `<tr>
                    <td><b>${o.apto}</b><span class="info-menor">${o.endereco_con}</span></td>
                    <td>${o.descricao_serv}<span class="info-menor">🔑 ${o.senha_porta}</span></td>
                    <td>${o.tecnico}</td>
                    <td><span class="${cl}">${o.status}</span></td>
                    <td><button onclick="del(${o.id})">🗑️</button></td>
                </tr>`;
            });
        }
        async function del(id) { if(confirm('Excluir?')) { await sb.from('ordens_servico').delete().eq('id', id); carregar(); } }
        carregar();
    </script>
</body>
</html>
