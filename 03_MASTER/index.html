<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM MASTER - GABS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        input, select, button { padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        input { flex: 1; min-width: 150px; }
        button { background: #2563eb; color: white; cursor: pointer; font-weight: bold; border: none; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; }
        th, td { padding: 10px; border: 1px solid #eee; text-align: left; }
        th { background: #1e293b; color: white; }
        .status-pendente { color: #d97706; font-weight: bold; }
        .status-andamento { color: #2563eb; font-weight: bold; }
        .status-concluido { color: #059669; font-weight: bold; }
        .info-menor { font-size: 11px; color: #64748b; display: block; margin-top: 4px; }
        .btn-foto { background: #6366f1; color: white; text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚀 Novo Chamado</h2>
        <div class="form-row">
            <input type="text" id="v_apto" placeholder="Apto (Ex: 1901)">
            <input type="text" id="v_end" placeholder="Edifício / Endereço">
            <input type="text" id="v_serv" placeholder="O que precisa ser feito?">
        </div>
        <div class="form-row">
            <select id="v_hosp">
                <option value="Sim">Hóspede no local? SIM</option>
                <option value="Não">Hóspede no local? NÃO</option>
            </select>
            <select id="v_tipo_acesso" onchange="toggleSenha()">
                <option value="Chave">Acesso: Chave</option>
                <option value="Senha">Acesso: Senha</option>
            </select>
            <input type="text" id="v_senha" placeholder="Digite a Senha" style="display:none; border-color: #2563eb;">
            <select id="v_tec">
                <option value="Israel Sillas">Israel Sillas</option>
                <option value="Wil Sampaio">Wil Sampaio</option>
            </select>
            <button onclick="salvar()">LANÇAR SERVIÇO</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Monitoramento de O.S</h2>
        <table id="tabela_os">
            <thead>
                <tr>
                    <th>Local / Apto</th>
                    <th>Serviço / Senha</th>
                    <th>Técnico</th>
                    <th>Status</th>
                    <th>Valor M.O</th>
                    <th>Nota Fiscal</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

<script>
    const sb = supabase.createClient('https://olawjagrfhcxsonmyopi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY');

    function toggleSenha() {
        const tipo = document.getElementById('v_tipo_acesso').value;
        document.getElementById('v_senha').style.display = (tipo === 'Senha') ? 'block' : 'none';
    }

    async function salvar() {
        const apto = document.getElementById('v_apto').value;
        const endereco = document.getElementById('v_end').value;
        const servico = document.getElementById('v_serv').value;
        const hospede = document.getElementById('v_hosp').value;
        const tipoAcesso = document.getElementById('v_tipo_acesso').value;
        const senha = document.getElementById('v_senha').value;
        const tecnico = document.getElementById('v_tec').value;

        if(!apto || !servico) { alert("Preencha o Apto e o Serviço!"); return; }

        const { error } = await sb.from('ordens_servico').insert([{
            apto: apto,
            endereco_condominio: endereco, 
            descricao_servico: servico,
            hospede_no_apto: hospede,
            senha_porta: (tipoAcesso === 'Senha') ? senha : 'Chave',
            tecnico: tecnico,
            status: 'Aberto'
        }]);

        if (error) alert("Erro: " + error.message);
        else { alert("Serviço lançado!"); carregar(); }
    }

    async function carregar() {
    // Buscamos as ordens primeiro
    const { data: ordens, error: erroOrdem } = await sb
        .from('ordens_servico')
        .select('*')
        .order('created_at', { ascending: false });

    if (erroOrdem) {
        console.error("Erro ao buscar ordens:", erroOrdem);
        return;
    }

    // Buscamos todas as notas fiscais
    const { data: notas, error: erroNotas } = await sb
        .from('notas_fiscaiss')
        .select('*');

    const l = document.getElementById('lista');
    l.innerHTML = '';

    ordens.forEach(o => {
        let statusClasse = 'status-pendente';
        if(o.status === 'Em Andamento') statusClasse = 'status-andamento';
        if(o.status === 'Concluido') statusClasse = 'status-concluido';

        // Procura se existe uma nota para esta OS específica
        const nota = notas ? notas.find(n => n.os_id === o.id) : null;
        
        const valorMO = nota ? `R$ ${nota.valor}` : '---';
        const linkFoto = nota ? `<a href="${nota.url_foto}" target="_blank" class="btn-foto">🖼️ Ver NF</a>` : '---';

        l.innerHTML += `
            <tr>
                <td><strong>${o.apto || '---'}</strong><span class="info-menor">📍 ${o.endereco_condominio || '---'}</span></td>
                <td>${o.descricao_servico || '---'}<span class="info-menor">🔑 Senha: ${o.senha_porta || '---'}</span></td>
                <td>${o.tecnico || '---'}</td>
                <td><span class="${statusClasse}">${o.status}</span></td>
                <td><strong>${valorMO}</strong></td>
                <td>${linkFoto}</td>
                <td><button onclick="del('${o.id}')" style="background:#ef4444; padding:5px 10px; border-radius:4px;">🗑️</button></td>
            </tr>`;
    });
}

    async function del(id) { 
        if(confirm('Excluir esta OS?')) { 
            await sb.from('ordens_servico').delete().eq('id', id); 
            carregar(); 
        } 
    }
    
    carregar();
    setInterval(carregar, 15000); // Atualiza a cada 15 seg
</script>
</body>
</html>
