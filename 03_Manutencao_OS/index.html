<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção OS - Super Host</title>
    <link rel="stylesheet" href="../style_global.css"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Forçamos o display none via CSS para não ter erro de carregamento */
        #secaoFinanceiraOS, #btnGerarOS {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="font-size: 1.4rem; color: #1e293b; margin: 0;">Manutenção - O.S</h1>
            <button class="badge-pix" onclick="window.location.href='../00_Portal/portal.html'" style="cursor: pointer; padding: 8px 15px; border-radius: 6px; border: 1px solid #ccc; background: white;">Voltar</button>
        </header>

        <section class="form-grid-vertical card" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <select id="cidadeOS" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="">Cidade</option>
                    <option value="santos">Santos</option>
                    <option value="guaruja">Guarujá</option>
                </select>
                <select id="tecnicoOS" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="">Carregando técnicos...</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <input type="text" id="enderecoOS" placeholder="Condomínio/Endereço" style="flex: 3; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                <input type="text" id="aptoOS" placeholder="Apto" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
            </div>

            <input type="text" id="servicoOS" placeholder="O que foi feito?" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 12px; box-sizing: border-box;">
            
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;">
                <label style="font-size: 11px; font-weight: bold; color: #64748b;">HÓSPEDE?</label>
                <select id="hospedeStatusOS" style="flex: 1; min-width: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="Sim">Sim</option>
                    <option value="Não" selected>Não</option>
                    <option value="Permitiu Entrada">Permitiu Entrada</option>
                </select>
                <input type="date" id="dataOS" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                <input type="time" id="horaEstimadaOS" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
            </div>

            <div id="secaoFinanceiraOS" style="margin-top: 15px; background: #f0f7ff; padding: 15px; border-radius: 8px; border: 2px dashed #2563eb;">
                <h3 style="font-size: 14px; margin-top: 0; color: #1e40af;">💰 Financeiro e NF</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="number" id="valorMaoObra" placeholder="Mão de Obra R$" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #bfdbfe;">
                    <input type="number" id="valorMateriais" placeholder="Materiais R$" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #bfdbfe;">
                </div>
                <input type="file" id="inputNF" accept="image/*" capture="camera">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btnIniciarOS" style="background: #10b981; flex: 1; color: white; padding: 15px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">▶️ Iniciar Serviço</button>
                <button id="btnGerarOS" style="background: #2563eb; flex: 1; color: white; padding: 15px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">✅ Salvar e Finalizar</button>
            </div>
        </section>

        <div id="listaOS" style="margin-top: 25px;">
            <h3 style="font-size: 16px; color: #475569;">Histórico Recente</h3>
            <div id="conteudoLista"></div>
        </div>
    </div>

    <script src="model_os.js"></script>
    <script src="view_os.js"></script>
    <script src="controller_os.js"></script>
</body>
</html>
