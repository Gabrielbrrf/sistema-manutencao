<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção OS - Técnico</title>
    <link rel="stylesheet" href="../style_global.css"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card-os { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #2563eb; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-iniciar { background: #10b981; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .secao-fechamento { display: none; margin-top: 15px; border-top: 1px dashed #ddd; padding-top: 15px; }
        input[type="number"] { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .btn-finalizar { background: #2563eb; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="font-size: 1.2rem; color: #1e293b;">🛠️ Meus Chamados</h1>
            <button onclick="window.location.reload()" style="padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background: white;">🔄</button>
        </header>

        <div id="lista-tarefas">
            <p style="text-align: center; color: #64748b;">Buscando serviços designados...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://olawjagrfhcxsonmyopi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarServicos() {
            const container = document.getElementById('lista-tarefas');
            
            // Puxa apenas o que a Gabs abriu e que ainda não está concluído
            const { data, error } = await _supabase
                .from('ordens_servico')
                .select('*')
                .eq('status', 'Pendente')
                .order('id', { ascending: false });

            if (data.length === 0) {
                container.innerHTML = '<p style="text-align: center;">Tudo em dia! Nenhuma OS pendente. ✅</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(os => {
                container.innerHTML += `
                    <div class="card-os" id="card-${os.id}">
                        <h3 style="margin: 0 0 5px 0; color: #1e293b;">📍 ${os.cliente}</h3>
                        <p style="margin: 0; color: #475569; font-size: 14px;">📝 ${os.descricao_servico}</p>
                        <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
                        
                        <button class="btn-iniciar" id="btn-ini-${os.id}" onclick="iniciar(${os.id})">INICIAR SERVIÇO</button>
                        
                        <div id="fechamento-${os.id}" class="secao-fechamento">
                            <input type="number" id="mao-obra-${os.id}" placeholder="Valor Mão de Obra R$">
                            <input type="number" id="material-${os.id}" placeholder="Materiais R$">
                            <label style="font-size: 12px; font-weight: bold;">📸 Foto da Nota Fiscal/Recibo:</label>
                            <input type="file" id="foto-${os.id}" accept="image/*" capture="camera" style="margin-bottom: 10px; width: 100%;">
                            <button class="btn-finalizar" onclick="finalizar(${os.id})">SALVAR E CONCLUIR</button>
                        </div>
                    </div>
                `;
            });
        }

        function iniciar(id) {
            document.getElementById(`btn-ini-${id}`).style.display = 'none';
            document.getElementById(`fechamento-${id}`).style.display = 'block';
        }

        async function finalizar(id) {
            const mo = document.getElementById(`mao-obra-${id}`).value;
            const mat = document.getElementById(`material-${id}`).value;
            const fotoInput = document.getElementById(`foto-${id}`);

            if (!mo) { alert("Informe o valor da mão de obra!"); return; }

            let base64 = "";
            if (fotoInput.files.length > 0) {
                const reader = new FileReader();
                base64 = await new Promise(res => {
                    reader.readAsDataURL(fotoInput.files[0]);
                    reader.onload = () => res(reader.result);
                });
            }

            const { error } = await _supabase
                .from('ordens_servico')
                .update({
                    status: 'Concluido',
                    valor_mao_de_obra: parseFloat(mo),
                    valor_gasto: parseFloat(mat || 0),
                    foto_nf: base64,
                    hora_conclusao: new Date().toISOString()
                })
                .eq('id', id);

            if (!error) {
                alert("✅ OS Concluída com sucesso!");
                carregarServicos();
            }
        }

        carregarServicos();
    </script>
</body>
</html>
