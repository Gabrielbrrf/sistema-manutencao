<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA MASTER - GABS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilo exclusivo da Gabs - Sem botões de técnico */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h2 { color: #1e293b; margin-top: 0; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
        
        .form-master { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .campo { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        .campo label { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        
        .btn-lancar { background: #3b82f6; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; height: 46px; }
        .btn-lancar:hover { background: #2563eb; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #1e293b; color: white; padding: 15px; text-align: left; font-size: 12px; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; background: white; font-size: 14px; }
        
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .pendente { background: #ffedd5; color: #9a3412; }
        .concluido { background: #dcfce7; color: #166534; }
        
        .btn-ver-nf { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-excluir { background: #fee2e2; color: #ef4444; border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div style="margin-bottom: 20px;">
        <a href="../00_Portal/portal.html" style="text-decoration: none; color: #64748b; font-weight: bold;">⬅️ Voltar ao Portal</a>
    </div>

    <div class="card">
        <h2>🚀 Lançar Novo Serviço</h2>
        <div class="form-master">
            <div class="campo">
                <label>ONDE? (Condomínio/Apto)</label>
                <input type="text" id="master_cliente" placeholder="Ex: Ed. Verano apto 12">
            </div>
            <div class="campo">
                <label>O QUE FAZER?</label>
                <input type="text" id="master_servico" placeholder="Ex: Trocar resistência chuveiro">
            </div>
            <div class="campo">
                <label>QUEM VAI?</label>
                <select id="master_tecnico">
                    <option value="">Selecione o técnico</option>
                    <option value="Israel Sillas">Israel Sillas</option>
                    <option value="Wil Sampaio">Wil Sampaio</option>
                </select>
            </div>
            <button class="btn-lancar" onclick="enviarParaTecnico()">LANÇAR AGORA</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Painel de Controle (Monitoramento)</h2>
        <table>
            <thead>
                <tr>
                    <th>LOCAL</th>
                    <th>SERVIÇO</th>
                    <th>TÉCNICO</th>
                    <th>VALORES (M.O / MAT)</th>
                    <th>STATUS</th>
                    <th>NF</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="tabela_corpo">
                <tr><td colspan="7">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const URL_DB = 'https://olawjagrfhcxsonmyopi.supabase.co';
    const KEY_DB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY';
    const db = supabase.createClient(URL_DB, KEY_DB);

    async function enviarParaTecnico() {
        const cliente = document.getElementById('master_cliente').value;
        const servico = document.getElementById('master_servico').value;
        const tecnico = document.getElementById('master_tecnico').value;

        if (!cliente || !servico || !tecnico) {
            alert("Gabs, preencha todos os campos!");
            return;
        }

        const { error } = await db.from('ordens_servico').insert([{ 
            cliente: cliente, 
            descricao_servico: servico, 
            tecnico: tecnico, 
            status: 'Pendente' 
        }]);

        if (!error) {
            alert("Lançado! Aparecerá no celular do técnico.");
            document.getElementById('master_cliente').value = '';
            document.getElementById('master_servico').value = '';
            carregarTabelaGabs();
        }
    }

    async function carregarTabelaGabs() {
        const { data, error } = await db.from('ordens_servico').select('*').order('id', { ascending: false });
        if (error) return;

        const htmlTabela = document.getElementById('tabela_corpo');
        htmlTabela.innerHTML = '';

        data.forEach(item => {
            const finalizado = item.status === 'Concluido' || item.status === 'Finalizado';
            const statusStyle = finalizado ? 'concluido' : 'pendente';
            const statusTexto = finalizado ? '✅ CONCLUÍDO' : '⏳ PENDENTE';
            
            const valores = finalizado 
                ? `R$ ${item.valor_mao_de_obra || 0} / R$ ${item.valor_gasto || 0}` 
                : '---';

            htmlTabela.innerHTML += `
                <tr>
                    <td><strong>${item.cliente}</strong></td>
                    <td>${item.descricao_servico}</td>
                    <td>${item.tecnico}</td>
                    <td>${valores}</td>
                    <td><span class="badge ${statusStyle}">${statusTexto}</span></td>
                    <td>
                        ${item.foto_nf ? `<button class="btn-ver-nf" onclick="exibirFoto('${item.foto_nf}')">👁️ VER</button>` : '---'}
                    </td>
                    <td>
                        <button class="btn-excluir" onclick="apagarOS(${item.id})">🗑️</button>
                    </td>
                </tr>
            `;
        });
    }

    function exibirFoto(base64) {
        const janela = window.open("");
        janela.document.write(`<body style="margin:0;display:flex;align-items:center;justify-content:center;background:#000;"><img src="${base64}" style="max-width:100%;max-height:100vh;"></body>`);
    }

    async function apagarOS(id) {
        if(confirm("Confirmar exclusão?")) {
            await db.from('ordens_servico').delete().eq('id', id);
            carregarTabelaGabs();
        }
    }

    carregarTabelaGabs();
</script>
</body>
</html>
