<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comissões Oficina - PROGGABS</title>
    <link rel="stylesheet" href="../style_global.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <script>
        const supabaseUrl = 'https://olawjagrfhcxsonmyopi.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Segurança de Acesso
        (function() {
            const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
            if (!usuario || (usuario.empresa !== 'MASTER' && usuario.empresa !== 'ADM')) {
                alert("Área Restrita!");
                window.location.href = "../00_Portal/portal.html";
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ Comissões da Oficina</h1>
            <div style="display: flex; gap: 10px;">
                <button class="badge-pix" onclick="window.location.href='../05_Relatorio_Faxina/relatorio.html'" style="background: #2563eb;">📊 Histórico</button>
                <button class="badge-pix" onclick="window.location.href='../00_Portal/portal.html'">Voltar</button>
            </div>
        </header>

        <section class="form-grid-vertical">
            <div style="display: flex; gap: 10px;">
                <select id="filtroCategoria" style="flex: 1;">
                    <option value="TODOS">Todos os Setores</option>
                    <option value="Operacional">👷 Mecânico</option>
                    <option value="Retifica">🏢 Retífica (Jose)</option>
                    <option value="ADM">👔 Escritório (ADM)</option>
                </select>
            </div>

            <select id="selectColaborador">
                <option value="">Carregando equipe...</option>
            </select>

            <div style="background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 10px;">
                <label style="font-size: 11px; font-weight: bold; color: #475569; display: block; margin-bottom: 6px;">📥 IMPORTAR ARQUIVO PDF:</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button type="button" id="btnUploadPdf" style="background: #4f46e5; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">
                        📁 Escolher PDF da OS
                    </button>
                    <input type="file" id="inputPdf" accept=".pdf" style="display: none;">
                    <span id="nomeArquivoPdf" style="font-size: 11px; color: #64748b; font-style: italic;">Nenhum arquivo carregado</span>
                </div>
            </div>

            <label style="font-size: 11px; font-weight: bold; margin-top: 10px;">TEXTO CAPTURADO DO PDF:</label>
            <textarea id="dadosComissao" placeholder="O texto extraído do PDF aparecerá aqui automaticamente..." style="height: 100px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-family: monospace;"></textarea>

            <div id="boxResultado" style="background: #f0fdf4; padding: 20px; border-radius: 12px; border: 2px solid #bbf7d0; margin-top: 15px; text-align: left;">
                <span style="display: block; font-size: 12px; color: #166534; font-weight: bold; text-align: center; margin-bottom: 10px;">
                    RESUMO DA ORDEM DE SERVIÇO
                </span>
                
                <div style="font-size: 13px; color: #334155; line-height: 1.6;">
                    📌 <strong>Nº O.S:</strong> <span id="resOS">-</span><br>
                    🛠️ <strong>Serviço:</strong> <span id="resServico">-</span><br>
                    ⏱️ <strong>Pronto:</strong> <span id="resPronto">-</span> | <strong>Saída:</strong> <span id="resSaida">-</span><br>
                    💵 <strong>Total do Serviço:</strong> <span id="resTotalServico">R$ 0,00</span><br>
                    📊 <strong>Taxa (20%):</strong> <span id="resTaxa">R$ 0,00</span><br>
                    📉 <strong>Subtotal / Total Geral:</strong> <span id="resSubtotal">R$ 0,00</span><br>
                </div>

                <hr style="border: 0; border-top: 1px dashed #bbf7d0; margin: 12px 0;">

                <div style="text-align: center;">
                    <span style="font-size: 11px; color: #166534; font-weight: bold; display: block;">VALOR DA COMISSÃO A PAGAR</span>
                    <strong id="valorTotalComissao" style="font-size: 32px; color: #15803d; display: block; margin: 5px 0;">R$ 0,00</strong>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-salvar" id="btnWhatsAppTexto" style="flex: 1; background: #25d366;">💬 Enviar via Whats</button>
                <button class="btn-salvar" id="btnImprimirPDF" style="flex: 1; background: #475569;">📄 Visualizar / PDF</button>
            </div>
        </section>
    </div>

    <script src="model_faxina.js?v=5"></script>
    <script src="view_faxina.js?v=5"></script>
    <script src="controller_faxina.js?v=5"></script>
</body>
</html>
