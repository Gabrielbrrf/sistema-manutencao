<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Super Host Brasil</title>
    <link rel="stylesheet" href="loguim.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="background-logo">
        <img src="logo_superhost.png" alt="Background Logo">
    </div>

    <div class="login-card">
        <h2>ÁREA DE ACESSO</h2>

        <div class="input-group">
            <label>Usuário</label>
            <input type="text" id="user" placeholder="Digite seu usuário">
        </div>
        
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="pass" placeholder="Digite sua senha">
        </div>

        <button onclick="tentarLogin()">ENTRAR NO SISTEMA</button>

        <p class="footer-text">Desenvolvido por PROGGABS</p>
    </div>

    <script>
        // Configuração direta com as suas chaves
        const SUPABASE_URL = 'https://olawjagrfhcxsonmyopi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY';
        
        // Inicializa o cliente dentro do script de login
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function tentarLogin() {
            const userLogin = document.getElementById('user').value.trim();
            const userPass = document.getElementById('pass').value.trim();

            if (!userLogin || !userPass) {
                alert("Preencha todos os campos!");
                return;
            }

            try {
                // Busca o colaborador usando 'loguim' (coluna com 'u')
                const { data, error } = await _supabase
                    .from('colaboradores')
                    .select('nome, loguim, ativo')
                    .eq('loguim', userLogin) 
                    .eq('senha', userPass)
                    .eq('ativo', true)
                    .single();

                if (data) {
                    // Salva os dados para o Portal
                    localStorage.setItem('usuarioLogado', JSON.stringify({
                        nome: data.nome,
                        loguim: data.loguim,
                        empresa: 'TECNICO' 
                    }));
                    
                    // Salva para a compatibilidade com a OS
                    localStorage.setItem('tecnico_nome', data.nome);
                    
                    window.location.href = 'portal.html';
                } else {
                    alert("Usuário ou senha incorretos (ou acesso desativado no banco)!");
                }
            } catch (err) {
                console.error("Erro no login:", err);
                alert("Erro ao conectar com o Supabase. Verifique sua internet.");
            }
        }
    </script>
</body>
</html>
