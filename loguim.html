<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Super Host Brasil</title>
    <link rel="stylesheet" href="loguim.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="model_os.js"></script>
</head>
<body>

    <div class="background-logo">
        <img src="logo_superhost.png" alt="Background Logo">
    </div>

    <div class="login-card">
        <h2>ÁREA DE ACESSO</h2>

        <div class="input-group">
            <label>Usuário</label>
            <input type="text" id="user" placeholder="Digite seu usuário">
        </div>
        
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="pass" placeholder="Digite sua senha">
        </div>

        <button onclick="tentarLogin()">ENTRAR NO SISTEMA</button>

        <p class="footer-text">Desenvolvido por PROGGABS</p>
    </div>

    <script>
        async function tentarLogin() {
            const userLogin = document.getElementById('user').value;
            const userPass = document.getElementById('pass').value;

            if (!userLogin || !userPass) {
                alert("Preencha todos os campos!");
                return;
            }

            // Verifica se o objeto _supabase existe (carregado do model_os.js)
            if (!window._supabase) {
                alert("Erro: Conexão com Supabase não encontrada.");
                return;
            }

            try {
                // Busca o colaborador no Supabase (ajustado para a sua coluna 'loguim')
                const { data, error } = await window._supabase
                    .from('colaboradores')
                    .select('nome, loguim, ativo')
                    .eq('loguim', userLogin) 
                    .eq('senha', userPass)
                    .eq('ativo', true)
                    .single();

                if (data) {
                    // Salva os dados no formato que o seu novo PORTAL espera
                    localStorage.setItem('usuarioLogado', JSON.stringify({
                        nome: data.nome,
                        loguim: data.loguim,
                        empresa: 'TECNICO' // Define como técnico para filtrar o menu
                    }));
                    
                    // Salva também o nome solto para a sua OS antiga não quebrar
                    localStorage.setItem('tecnico_nome', data.nome);
                    
                    window.location.href = 'portal.html';
                } else {
                    alert("Usuário, senha incorretos ou acesso negado!");
                }
            } catch (err) {
                console.error("Erro no login:", err);
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
