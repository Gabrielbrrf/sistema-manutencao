<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnico - Gabs OS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 15px; }
        .card-os { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #2563eb; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h3 { margin: 0 0 10px 0; color: #1e293b; }
        .info-linha { margin: 8px 0; font-size: 15px; color: #475569; }
        .info-acesso { background: #fef9c3; padding: 10px; border-radius: 8px; font-size: 14px; margin: 10px 0; border: 1px solid #fde047; color: #854d0e; }
        .btn-acao { background: #10b981; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .badge-hospede { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; float: right; }
    </style>
</head>
<body>
    <h2 style="color: #1e293b;">🛠️ Meus Serviços</h2>
    <div id="lista-chamados">Carregando...</div>

    <script>
        const sb = supabase.createClient('https://olawjagrfhcxsonmyopi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY');

        async function carregar() {
            try {
                const { data, error } = await sb.from('ordens_servico').select('*').neq('status', 'Concluido').order('id', { ascending: false });
                if (error) throw error;

                const container = document.getElementById('lista-chamados');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p>Nenhum serviço para hoje! ☕</p>';
                    return;
                }

                data.forEach(os => {
                    const estaAndamento = os.status === 'Em Andamento';
                    container.innerHTML += `
                        <div class="card-os" style="border-left-color: ${estaAndamento ? '#f59e0b' : '#2563eb'}">
                            ${os.hospede_no_apto === 'Sim' ? '<span class="badge-hospede">⚠️ HÓSPEDE</span>' : ''}
                            <h3>📍 Apto: ${os.apto || '---'}</h3>
                            <div class="info-linha">🏢 <b>Edifício:</b> ${os.endereco_condominio || '---'}</div>
                            <div class="info-linha">📝 <b>Serviço:</b> ${os.descricao_servico || '---'}</div>
                            <div class="info-acesso">
                                <b>🔑 ACESSO:</b> ${os.senha_porta || 'Chave'}
                            </div>
                            <button class="btn-acao" 
                                    style="background: ${estaAndamento ? '#ef4444' : '#10b981'}" 
                                    onclick="mudarStatus(${os.id}, '${os.status}')">
                                ${estaAndamento ? 'FINALIZAR AGORA' : 'INICIAR SERVIÇO'}
                            </button>
                        </div>`;
                });
            } catch (err) {
                alert("Erro ao carregar: " + err.message);
            }
        }

        async function mudarStatus(id, statusAtual) {
            const novoStatus = (statusAtual === 'Em Andamento') ? 'Concluido' : 'Em Andamento';
            
            // Log para você ver no computador se o clique funcionou
            console.log("Clicou no botão! ID:", id, "Novo Status:", novoStatus);

            try {
                const { error } = await sb.from('ordens_servico')
                    .update({ status: novoStatus })
                    .eq('id', id);

                if (error) {
                    alert("Erro no Banco: " + error.message);
                } else {
                    alert("Sucesso! Status alterado para: " + novoStatus);
                    carregar();
                }
            } catch (err) {
                alert("Erro crítico: " + err.message);
            }
        }

        carregar();
        setInterval(carregar, 30000);
    </script>
</body>
</html>
