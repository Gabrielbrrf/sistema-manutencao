<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnico - Gabs OS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 15px; }
        .card-os { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #2563eb; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-acao { background: #10b981; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .input-finalizar { width: 93%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <h2 style="color: #1e293b;">🛠️ Meus Serviços</h2>
    <div id="lista-chamados">Carregando...</div>

    <script>
        const sb = supabase.createClient('https://olawjagrfhcxsonmyopi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY');

        async function carregar() {
            const { data, error } = await sb.from('ordens_servico').select('*').neq('status', 'Concluido').order('id', { ascending: false });
            if (error) return;

            const container = document.getElementById('lista-chamados');
            container.innerHTML = '';

            data.forEach(os => {
                const estaAndamento = os.status === 'Em Andamento';
                
                container.innerHTML += `
                    <div class="card-os" style="border-left-color: ${estaAndamento ? '#f59e0b' : '#2563eb'}">
                        <h3>📍 Apto: ${os.apto || '---'}</h3>
                        <p>📝 ${os.descricao_servico || '---'}</p>
                        
                        ${estaAndamento ? `
                            <div id="form-finalizar-${os.id}">
                                <input type="number" id="valor-${os.id}" class="input-finalizar" placeholder="Valor do Serviço (R$)">
                                <input type="text" id="nf-${os.id}" class="input-finalizar" placeholder="Número da NF">
                                <button class="btn-acao" style="background: #ef4444" onclick="finalizarServico(${os.id})">FINALIZAR E ENVIAR</button>
                            </div>
                        ` : `
                            <button class="btn-acao" onclick="iniciarServico(${os.id})">🚀 INICIAR SERVIÇO</button>
                        `}
                    </div>`;
            });
        }

        async function iniciarServico(id) {
            const agora = new Date().toISOString();
            const { error } = await sb.from('ordens_servico')
                .update({ status: 'Em Andamento', hora_inicio: agora })
                .eq('id', id);

            if (!error) {
                alert("Serviço Iniciado!");
                carregar();
            } else {
                alert("Erro: " + error.message);
            }
        }

        async function finalizarServico(id) {
            const valor = document.getElementById(`valor-${id}`).value;
            const nf = document.getElementById(`nf-${id}`).value;
            const agora = new Date().toISOString();

            if (!valor || !nf) {
                alert("Por favor, preencha o Valor e a NF para finalizar!");
                return;
            }

            const { error } = await sb.from('ordens_servico')
                .update({ 
                    status: 'Concluido', 
                    hora_conclusao: agora,
                    valor_servico: valor, // Confirme se o nome da coluna é este
                    numero_nf: nf         // Confirme se o nome da coluna é este
                })
                .eq('id', id);

            if (!error) {
                alert("Serviço Concluído com Sucesso!");
                carregar();
            } else {
                alert("Erro ao finalizar: " + error.message);
            }
        }

        carregar();
    </script>
</body>
</html>
