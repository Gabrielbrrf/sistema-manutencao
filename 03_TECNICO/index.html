<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnico - Ordens de Serviço</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 15px; }
        .card-os { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #2563eb; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; color: #1e293b; }
        .info-linha { margin: 8px 0; font-size: 15px; color: #334155; }
        .info-acesso { background: #fef9c3; padding: 10px; border-radius: 8px; font-size: 14px; margin: 10px 0; border: 1px solid #fde047; color: #854d0e; }
        .btn-acao { background: #10b981; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-acao:active { transform: scale(0.98); background: #059669; }
        .badge-hospede { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="color: #1e293b;">🛠️ Meus Serviços</h2>
    <div id="lista-chamados">Carregando serviços...</div>

    <script>
        const sb = supabase.createClient('https://olawjagrfhcxsonmyopi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sYXdqYWdyZmhjeHNvbm15b3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mzc2NTEsImV4cCI6MjA4NjUxMzY1MX0.KB-n1QyDmDarzBofPuZ-SGUSUCwJsFq9p-HV3bWWMaY');

        async function carregar() {
            const { data, error } = await sb.from('ordens_servico')
                .select('*')
                .neq('status', 'Concluido')
                .order('id', { ascending: false });

            if (error) {
                console.error("Erro ao carregar:", error);
                return;
            }

            const container = document.getElementById('lista-chamados');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<p>Nenhum serviço pendente. 🙌</p>';
                return;
            }

            data.forEach(os => {
                // Ajustado para os nomes reais das suas colunas: hospede_no_apto e endereco_condominio
                const tagHospede = os.hospede_no_apto === 'Sim' ? '<span class="badge-hospede">⚠️ COM HÓSPEDE</span>' : '';
                const estaAndamento = os.status === 'Em Andamento';

                container.innerHTML += `
                    <div class="card-os" style="border-left-color: ${estaAndamento ? '#f59e0b' : '#2563eb'}">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h3>📍 Apto: ${os.apto || '---'}</h3>
                            ${tagHospede}
                        </div>
                        <div class="info-linha">🏢 <b>Edifício:</b> ${os.endereco_condominio || 'Não informado'}</div>
                        <div class="info-linha">📝 <b>Serviço:</b> ${os.descricao_servico || 'Sem descrição'}</div>
                        
                        <div class="info-acesso">
                            <b>🔑 FORMA DE ACESSO:</b><br>
                            <span style="font-size: 18px; font-weight: bold;">${os.senha_porta || 'Chave'}</span>
                        </div>

                        <button class="btn-acao" 
                                style="background: ${estaAndamento ? '#64748b' : '#10b981'}" 
                                onclick="iniciar(${os.id}, '${os.status}')">
                            ${estaAndamento ? 'FINALIZAR SERVIÇO' : 'INICIAR SERVIÇO'}
                        </button>
                    </div>`;
            });
        }

        async function iniciar(id, statusAtual) {
            const novoStatus = (statusAtual === 'Em Andamento') ? 'Concluido' : 'Em Andamento';
            const agora = new Date().toISOString();

            // Criamos o objeto de atualização
            let dadosUpdate = { status: novoStatus };
            
            // Se estiver iniciando, grava a hora_inicio. Se finalizando, hora_conclusao.
            if (novoStatus === 'Em Andamento') dadosUpdate.hora_inicio = agora;
            if (novoStatus === 'Concluido') dadosUpdate.hora_conclusao = agora;

            const { error } = await sb.from('ordens_servico')
                .update(dadosUpdate)
                .eq('id', id);
            
            if (!error) {
                alert("Status atualizado com sucesso!");
                carregar();
            } else {
                alert("Erro ao atualizar: " + error.message);
            }
        }

        carregar();
        setInterval(carregar, 30000);
    </script>
</body>
</html>
