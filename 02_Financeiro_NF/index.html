<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Financeiro SHB - PROGGABS</title>
    <link rel="stylesheet" href="../style_global.css">
    <script>
    (function() {
        const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
        // Se não for MASTER, expulsa para o portal
        if (!usuario || (usuario.empresa !== 'MASTER' && usuario.empresa !== 'ADM')) {
            alert("Área Restrita!");
            window.location.href = "../portal.html";
        }
    })();
</script>
</head>
<body>
    <div class="container">
        <header>
            <a href="../00_Portal/portal.html" class="btn-voltar">⬅️ Menu Principal</a>
            <h1>📑 Arquivo de Notas Fiscais</h1>
        </header>

        <section class="card-upload">
            <h3>Nova Manutenção</h3>
            <div class="form-grid">
                <input type="file" id="nf-file" accept="image/*,application/pdf">
                <input type="text" id="nf-apto" placeholder="Apto (Ex: 12)">
                <input type="date" id="nf-data">
                <input type="number" id="nf-valor" placeholder="Valor R$">
                <input type="text" id="nf-manutencao" placeholder="Tipo de Manutenção">
                <button class="btn-salvar" id="btn-salvar-nf">Anexar e Salvar</button>
            </div>
        </section>

        <hr>

        <div class="meses-container">
            <button onclick="window.filtrarMes(1)">JAN</button><button onclick="window.filtrarMes(2)">FEV</button>
            <button onclick="window.filtrarMes(3)">MAR</button><button onclick="window.filtrarMes(4)">ABR</button>
            <button onclick="window.filtrarMes(5)">MAI</button><button onclick="window.filtrarMes(6)">JUN</button>
            <button onclick="window.filtrarMes(7)">JUL</button><button onclick="window.filtrarMes(8)">AGO</button>
            <button onclick="window.filtrarMes(9)">SET</button><button onclick="window.filtrarMes(10)">OUT</button>
            <button onclick="window.filtrarMes(11)">NOV</button><button onclick="window.filtrarMes(12)">DEZ</button>
        </div>

        <div id="grid-nfs" class="grid-aptos">
            <p>Selecione um mês para ver as notas.</p>
        </div>
    </div>

    <div id="modal-nota" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 id="modal-titulo"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="controller_nf.js"></script>
</body>

</html>
