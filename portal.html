<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel PROGGABS - Super Host Brasil</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0f0f0f; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        h1 { margin-bottom: 40px; letter-spacing: 2px; color: #d4af37; text-align: center; } 
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            width: 90%;
            max-width: 1000px; 
            padding: 20px;
        }

        .card { 
            background: #1e1e1e; 
            padding: 40px 20px; 
            border-radius: 15px; 
            text-align: center; 
            border: 1px solid #333; 
            transition: all 0.3s ease; 
            cursor: pointer; 
            text-decoration: none; 
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card:not(.vago):hover { 
            border-color: #d4af37; 
            transform: translateY(-5px); 
            background: #252525;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .card span { font-size: 35px; }
        
        .vago { 
            opacity: 0.3; 
            cursor: not-allowed; 
            background: #151515;
        }
        
        .logout-link {
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <h1 id="boas-vindas">SISTEMA PROGGABS</h1>
    
    <div class="grid" id="grid-sistemas">
        <a href="01_Gestao_Pix/index.html" id="card-pix" class="card">
            <span>💰</span>
            <strong>Contatos PIX</strong>
        </a>

        <a href="04_Pagamento_Faxina/index.html" id="card-faxina" class="card">
            <span>🧹</span>
            <strong>Pagamento Faxina</strong>
        </a>

        <a href="03_Manutencao/manutencao.html" id="card-manutencao" class="card">
            <span>🛠️</span>
            <strong>Manutenção OS</strong>
        </a>

        <a href="02_Financeiro_NF/index.html" id="card-financeiro" class="card">
            <span>📑</span>
            <strong>Arquivo de Notas</strong>
        </a>

        <a href="04_Pagamento_Faxina/relatorio.html" id="card-relatorio" class="card">
            <span>📊</span>
            <strong>Relatório Geral</strong>
        </a>

        <a href="meu_ponto.html" id="card-ponto" class="card">
            <span>⏱️</span>
            <strong>Meu Ponto</strong>
        </a>
    </div>

    <a href="loguim.html" class="logout-link" onclick="localStorage.removeItem('usuarioLogado')">Sair do Sistema</a>

    <script>
        window.onload = function() {
            const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));

            if (!usuarioLogado) {
                window.location.href = "loguim.html";
                return;
            }

            const nivel = usuarioLogado.empresa; // MASTER, MANUTENCAO ou OPERACIONAL
            const nomeUser = usuarioLogado.nome.split(' ')[0].toUpperCase();
            
            document.getElementById('boas-vindas').innerText = `SISTEMA ${nivel}: ${nomeUser}`;

            // Função para esconder o que não deve ser visto
            const esconder = (id) => { 
                const el = document.getElementById(id);
                if(el) el.style.display = 'none'; 
            };

            // CONTROLE DE ACESSO POR NÍVEL
            if (nivel === 'MASTER' || nivel === 'ADM') {
                // MASTER vê tudo, não precisa esconder nada.
                // Ajustamos apenas links específicos se necessário
                document.getElementById('card-ponto').href = "relatorios_gerais.html"; // Ver pontos de todos
            } 
            
            else if (nivel === 'OPERACIONAL') {
                // FAXINEIRAS: Só veem Ponto e Orientações (se houver)
                esconder('card-pix');
                esconder('card-financeiro');
                esconder('card-manutencao');
                esconder('card-relatorio');
                esconder('card-faxina'); // Elas não calculam o próprio pagamento
                
                document.getElementById('card-ponto').href = "ponto_faxina.html";
            }

            else if (nivel === 'MANUTENCAO') {
                // TÉCNICOS: Veem Ordens de Serviço e o próprio Ponto
                esconder('card-pix');
                esconder('card-financeiro');
                esconder('card-faxina');
                esconder('card-relatorio');
                
                document.getElementById('card-manutencao').href = "03_Manutencao/manutencao.html";
                document.getElementById('card-ponto').href = "meu_ponto.html";
            }
        }
    </script>
</body>
</html>
