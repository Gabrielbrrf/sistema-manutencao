<body>
    <div class="container">
        <header>
            <a href="../00_Portal/portal.html" class="btn-voltar">⬅️ Menu</a>
            <h1>💰 Gestão de Pagamentos</h1>
        </header>

        <div class="meses-container" style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
            <button id="btn-tab-lista" class="tab-btn active" style="flex: 1;">🔍 Pesquisar</button>
            <button id="btn-tab-cadastro" class="tab-btn" style="flex: 1; background: #27ae60;">➕ Novo Cadastro</button>
        </div>

        <main id="aba-lista">
            <div class="search-container" style="margin-bottom: 20px;">
                <input type="text" id="inputBusca" placeholder="Quem você está procurando?" style="width: 100%;">
            </div>
            
            <div id="conteudo-lista"></div>
        </main>

        <section id="aba-cadastro" class="hidden">
            <div class="form-grid-vertical">
                <h3 style="margin-bottom: 10px; color: #2c3e50;">Cadastrar Colaborador</h3>
                
                <input type="text" id="reg-nome" placeholder="Nome Completo">
                <input type="text" id="reg-pix" placeholder="Chave PIX">
                <input type="text" id="reg-tel" placeholder="Telefone (Ex: 551399...)">
                <input type="text" id="reg-banco" placeholder="Nome do Banco">
                
                <label style="font-size: 12px; font-weight: bold; color: #64748b; margin-top: 10px;">Cidade ou Setor:</label>
                <select id="reg-cidade">
                    <option value="Administração">👔 Administração (Interno)</option>
                    <option value="Santos" selected>Santos</option>
                    <option value="São Vicente">São Vicente</option>
                    <option value="Guarujá">Guarujá</option>
                    <option value="Praia Grande">Praia Grande</option>
                </select>

                <label style="font-size: 12px; font-weight: bold; color: #64748b; margin-top: 10px;">Tipo de Serviço:</label>
                <select id="reg-categoria">
                    <option value="Clube XV">🏢 Clube XV</option>
                    <option value="Manutenção">🛠️ Manutenção (Fixo)</option>
                    <option value="Daniel (PJ/MEI)">👷 Daniel (PJ/MEI)</option>
                    <option value="Faxina">🧹 Faxina / Avulsa</option>
                    <option value="Freelancer">🎸 Freelancer</option>
                    <option value="CLT">📝 CLT</option>
                    <option value="Operacional">👷 Operacional (ADM)</option>
                    <option value="ADM">👔 Outros Colaboradores (ADM)</option>
                </select>
                
                <button class="btn-salvar" id="btn-salvar" style="margin-top: 20px;">SALVAR NO BANCO</button>
            </div>
        </section>
    </div>

    <script type="module" src="controller.js"></script>
